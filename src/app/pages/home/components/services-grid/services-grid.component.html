<section class="mmk-section services-section">
  <div class="mmk-container">
    <div class="services-header">
      <span class="eyebrow">OUR CORE SERVICES</span>
      <h2 class="section-title">
        Enterprise engineering services <br>
        <span class="brand-gradient-text">built for business scale.</span>
      </h2>
      <p class="section-subtitle">
        We provide complete software lifecycle solutions from architectural design to deployment and continuous SLA technical support.
      </p>
    </div>

    <div class="services-cards-grid">
      <div *ngFor="let srv of services" class="service-card mmk-glass-card">
        <div class="card-top">
          <div class="service-icon-box">
            <span class="icon-dot"></span>
          </div>
          <a [routerLink]="['/services']" class="card-arrow-link" aria-label="View Service">
            <svg class="arrow-svg" viewBox="0 0 20 20" fill="currentColor">
              <path fill-rule="evenodd" d="M10.293 3.293a1 1 0 011.414 0l6 6a1 1 0 010 1.414l-6 6a1 1 0 01-1.414-1.414L14.586 11H3a1 1 0 110-2h11.586l-4.293-4.293a1 1 0 010-1.414z" clip-rule="evenodd"/>
            </svg>
          </a>
        </div>

        <h3 class="srv-title">{{ srv.title }}</h3>
        <p class="srv-desc">{{ srv.shortDescription }}</p>

        <ul class="deliverables-list">
          <li *ngFor="let d of srv.deliverables">{{ d }}</li>
        </ul>
      </div>
    </div>
  </div>
</section>
