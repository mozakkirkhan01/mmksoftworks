<section class="mmk-section industries-section">
  <div class="mmk-container">
    <div class="ind-header text-center">
      <span class="eyebrow">DOMAINS & VERTICALS</span>
      <h2 class="section-title">
        Built for the way <br>
        <span class="brand-gradient-text">your industry works.</span>
      </h2>
      <p class="section-subtitle">
        Deep domain expertise across education, hospitality, retail, healthcare, and cooperative financial sectors in India.
      </p>
    </div>

    <div class="ind-grid">
      <div *ngFor="let ind of industries" class="ind-card mmk-glass-card">
        <div class="card-icon-header">
          <!-- Custom SVG Icons -->
          <div class="svg-icon-wrapper">
            <!-- Education -->
            <svg *ngIf="ind.icon === 'education-hat'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
              <path d="M12 3L2 8.5L12 14L22 8.5L12 3Z"/>
              <path d="M5 10.15V17L12 21L19 17V10.15"/>
            </svg>
            <!-- Travel -->
            <svg *ngIf="ind.icon === 'airplane'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
              <path d="M17.8 19.2L16 11L21 6.5C21.6 5.9 21.6 4.9 21 4.3C20.4 3.7 19.4 3.7 18.8 4.3L14.3 9.3L6.1 7.5C5.5 7.4 4.9 7.7 4.6 8.2L3.5 10L8.5 13.5L6.5 17L4 16.5L3 17.5L6 20.5L7 19.5L6.5 17L10 15L13.5 20L15.3 18.9C15.8 18.6 16.1 18 16 17.4L17.8 19.2Z"/>
            </svg>
            <!-- Retail -->
            <svg *ngIf="ind.icon === 'shopping-cart'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
              <circle cx="9" cy="21" r="1"/>
              <circle cx="20" cy="21" r="1"/>
              <path d="M1 1H5L7.68 14.39C7.77 14.85 8.17 15.19 8.64 15.19H19.4C19.86 15.19 20.26 14.85 20.35 14.39L22 6H6"/>
            </svg>
            <!-- Healthcare -->
            <svg *ngIf="ind.icon === 'medical-cross'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
              <path d="M19 10.5H13.5V5C13.5 4.17 12.83 3.5 12 3.5C11.17 3.5 10.5 4.17 10.5 5V10.5H5C4.17 10.5 3.5 11.17 3.5 12C3.5 12.83 4.17 13.5 5 13.5H10.5V19C10.5 19.83 11.17 20.5 12 20.5C12.83 20.5 13.5 19.83 13.5 19V13.5H19C19.83 13.5 20.5 12.83 20.5 12C20.5 11.17 19.83 10.5 19 10.5Z"/>
            </svg>
            <!-- Cooperative -->
            <svg *ngIf="ind.icon === 'community-users'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
              <path d="M17 21V19C17 16.79 15.21 15 13 15H5C2.79 15 1 16.79 1 19V21"/>
              <circle cx="9" cy="7" r="4"/>
              <path d="M23 21V19C22.99 17.18 21.7 15.62 19.9 15.15"/>
              <path d="M16 3.13C17.8 3.6 19.1 5.16 19.1 7C19.1 8.84 17.8 10.4 16 10.87"/>
            </svg>
            <!-- Office -->
            <svg *ngIf="ind.icon === 'office-building'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
              <path d="M3 21H21"/>
              <path d="M5 21V5C5 3.9 5.9 3 7 3H17C18.1 3 19 3.9 19 5V21"/>
              <path d="M9 7H11"/>
              <path d="M13 7H15"/>
              <path d="M9 11H11"/>
              <path d="M13 11H15"/>
              <path d="M9 15H11"/>
              <path d="M13 15H15"/>
            </svg>
          </div>

          <a routerLink="/industries" class="ind-arrow-btn">
            →
          </a>
        </div>

        <h3 class="ind-title">{{ ind.title }}</h3>
        <p class="ind-desc">{{ ind.description }}</p>

        <div class="modules-pills">
          <span *ngFor="let m of ind.keyModules" class="mod-tag">{{ m }}</span>
        </div>
      </div>
    </div>
  </div>
</section>
