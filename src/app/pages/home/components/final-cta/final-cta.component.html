<section class="mmk-section cta-section">
  <div class="mmk-container">
    <div class="cta-card mmk-glass-card">
      <div class="cta-bg-lines">
        <svg viewBox="0 0 1000 400" fill="none">
          <path d="M0 200 Q 250 50, 500 200 T 1000 200" stroke="rgba(25, 211, 255, 0.2)" stroke-width="2" stroke-dasharray="8 8"/>
          <path d="M0 100 Q 350 350, 700 100 T 1000 300" stroke="rgba(32, 214, 181, 0.2)" stroke-width="2"/>
        </svg>
      </div>

      <div class="cta-content">
        <span class="eyebrow">LET'S TRANSFORM YOUR OPERATIONS</span>
        <h2 class="cta-headline">
          Have a process that needs <br>
          <span class="brand-gradient-text">better software?</span>
        </h2>
        <p class="cta-desc">
          Tell us how your business works. We'll help you turn it into a smarter, faster, and fully automated digital system.
        </p>

        <div class="cta-buttons">
          <button (click)="scrollToContact()" class="btn-cta primary">
            <span>Start a Project</span>
            <svg viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M10.293 3.293a1 1 0 011.414 0l6 6a1 1 0 010 1.414l-6 6a1 1 0 01-1.414-1.414L14.586 11H3a1 1 0 110-2h11.586l-4.293-4.293a1 1 0 010-1.414z" clip-rule="evenodd"/></svg>
          </button>
          <a routerLink="/contact" class="btn-cta secondary">
            Talk to MMK Softworks
          </a>
        </div>
      </div>
    </div>
  </div>
</section>
